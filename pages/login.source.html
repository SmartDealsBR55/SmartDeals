<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="robots" content="noindex, nofollow">

  <title>Área dos Afiliados | SmartDeals</title>

  <meta name="theme-color" content="#0b0a07">
  <link rel="manifest" href="/SmartDeals/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/SmartDeals/assets/icons/smartdeals-192.png">

  <link rel="stylesheet" href="../assets/css/admin.css">
</head>

<body class="login-page">

  <main class="login-container">

    <section class="login-card">
      <div class="login-logo">
        <h1>SmartDeals</h1>
        <p id="titulo-acesso">Área dos afiliados</p>
      </div>

      <form id="form-login">
        <label id="campo-nome" hidden>Seu nome
          <input id="nome-conta" autocomplete="name" maxlength="80" placeholder="Como você quer ser chamado">
        </label>
        <label>
          E-mail
          <input
            id="email"
            type="email"
            required
            autocomplete="email"
            placeholder="seu@email.com"
          >
        </label>

        <label>
          Senha
          <input
            id="senha"
            type="password"
            required
            autocomplete="current-password"
            placeholder="Digite sua senha"
          >
        </label>

        <button type="submit">
          Entrar no painel
        </button>

        <p id="mensagem-login" role="status" aria-live="polite" hidden></p>
        <button id="alternar-cadastro" type="button">Sou afiliado — criar conta</button>
        <button id="recuperar-senha" type="button">Esqueci minha senha</button>
        <p>Publique ofertas com seus links de afiliado. Você é responsável pelos dados e imagens que cadastrar. <a href="politica.html">Privacidade</a></p>
      </form>

      <a class="voltar-site" href="../index.html">
        Voltar ao SmartDeals
      </a>
    </section>

  </main>

  <script type="module" src="../assets/js/auth.js"></script>
  <script type="module" src="../assets/js/pwa.js"></script>

</body>
</html>
